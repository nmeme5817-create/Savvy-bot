          package live.savvybot

          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private lateinit var status: TextView

              private val launcher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      if (r.resultCode == RESULT_OK && r.data != null) {
                          startForegroundService(
                              Intent(this, CaptureService::class.java).apply {
                                  action = CaptureService.ACTION_START
                                  putExtra("code", r.resultCode)
                                  putExtra("data", r.data)
                              }
                          )
                          status.text = "running - switch to Savvy"
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("bot", MODE_PRIVATE)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 48)
                  }

                  root.addView(TextView(this).apply { text = "SavvyBot"; textSize = 26f })
                  root.addView(TextView(this).apply {
                      text = "Grant all three, then start. The strip appears over the game."
                      textSize = 13f; setPadding(0, 16, 0, 32)
                  })
                  root.addView(Button(this).apply {
                      text = "1. Accessibility settings"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "2. Allow drawing over apps"
                      setOnClickListener {
                          startActivity(Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + packageName)
                          ))
                      }
                  })
                  root.addView(Switch(this).apply {
                      text = "3. Auto-send guesses"
                      isChecked = prefs.getBoolean("auto", false)
                      setPadding(0, 32, 0, 8)
                      setOnCheckedChangeListener { _, v -> prefs.edit().putBoolean("auto", v).apply() }
                  })
                  root.addView(TextView(this).apply {
                      text = "Colour tolerance"; textSize = 12f; setPadding(0, 24, 0, 0)
                  })
                  root.addView(SeekBar(this).apply {
                      max = 18
                      progress = ((prefs.getFloat("tol", 1f) - 0.6f) * 10).toInt().coerceIn(0, 18)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, f: Boolean) {
                              prefs.edit().putFloat("tol", 0.6f + p / 10f).apply()
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  })
                  root.addView(Button(this).apply {
                      text = "Start solver"
                      setPadding(0, 40, 0, 0)
                      setOnClickListener {
                          if (SavvyA11yService.instance == null) {
                              status.text = "enable accessibility first"; return@setOnClickListener
                          }
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              status.text = "allow overlay first"; return@setOnClickListener
                          }
                          val mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          launcher.launch(mgr.createScreenCaptureIntent())
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Stop"
                      setOnClickListener {
                          startService(Intent(this@MainActivity, CaptureService::class.java)
                              .setAction(CaptureService.ACTION_STOP))
                          status.text = "stopped"
                      }
                  })
                  status = TextView(this).apply { setPadding(0, 32, 0, 0); textSize = 13f }
                  root.addView(status)
                  setContentView(root)
              }
          }
