          cat > app/src/main/java/live/savvybot/SavvyA11yService.kt <<'EOF'
          package live.savvybot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class SavvyA11yService : AccessibilityService() {

              data class Cell(val letter: Char, val bounds: Rect)

              override fun onServiceConnected() { instance = this }
              override fun onDestroy() { instance = null; super.onDestroy() }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun gameRoot(): AccessibilityNodeInfo? {
                  val root = rootInActiveWindow ?: return null
                  return if (root.packageName == TARGET) root
                  else windows.firstOrNull { it.root?.packageName == TARGET }?.root
              }

              fun readCells(): List<Cell> {
                  val root = gameRoot() ?: return emptyList()
                  val out = ArrayList<Cell>()
                  walk(root, out, 0)
                  return out.sortedWith(
                      compareBy({ it.bounds.centerY() / 40 }, { it.bounds.centerX() })
                  )
              }

              private fun walk(node: AccessibilityNodeInfo?, out: MutableList<Cell>, depth: Int) {
                  if (node == null || depth > 40) return
                  val txt = (node.text ?: node.contentDescription)?.toString()?.trim()
                  if (!txt.isNullOrEmpty() && txt.length == 1 && txt[0].isLetter()) {
                      val r = Rect()
                      node.getBoundsInScreen(r)
                      if (r.width() > 12 && r.height() > 12) out.add(Cell(txt[0].lowercaseChar(), r))
                  }
                  for (i in 0 until node.childCount) walk(node.getChild(i), out, depth + 1)
              }

              fun tapLabel(label: String): Boolean {
                  val root = gameRoot() ?: return false
                  val hit = find(root, label, 0) ?: return false
                  var n: AccessibilityNodeInfo? = hit
                  while (n != null) {
                      if (n.isClickable) return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      n = n.parent
                  }
                  val r = Rect().also { hit.getBoundsInScreen(it) }
                  return tapPoint(r.centerX().toFloat(), r.centerY().toFloat())
              }

              private fun find(node: AccessibilityNodeInfo?, label: String, depth: Int): AccessibilityNodeInfo? {
                  if (node == null || depth > 40) return null
                  val txt = (node.text ?: node.contentDescription)?.toString()?.trim()?.lowercase()
                  if (txt == label.lowercase()) return node
                  for (i in 0 until node.childCount) find(node.getChild(i), label, depth + 1)?.let { return it }
                  return null
              }

              fun tapPoint(x: Float, y: Float): Boolean {
                  val p = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 40)).build()
                  return dispatchGesture(g, null, null)
              }

              companion object {
                  const val TARGET = "live.playsavvy.savvy"
                  var instance: SavvyA11yService? = null
              }
          }
          EOF

          cat > app/src/main/java/live/savvybot/TileClassifier.kt <<'EOF'
          package live.savvybot

          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Rect

          object TileClassifier {
              fun classify(bmp: Bitmap, cell: Rect, tolerance: Float): Char {
                  val patch = 9
                  var r = 0L; var g = 0L; var b = 0L; var n = 0
                  val cx = cell.centerX(); val cy = cell.centerY()
                  for (dx in -patch..patch) for (dy in -patch..patch) {
                      val x = (cx + dx).coerceIn(0, bmp.width - 1)
                      val y = (cy + dy).coerceIn(0, bmp.height - 1)
                      val p = bmp.getPixel(x, y)
                      r += Color.red(p); g += Color.green(p); b += Color.blue(p); n++
                  }
                  if (n == 0) return '?'
                  val hsv = FloatArray(3)
                  Color.RGBToHSV((r / n).toInt(), (g / n).toInt(), (b / n).toInt(), hsv)
                  val hue = hsv[0]; val sat = hsv[1]; val v = hsv[2]
                  if (v < 0.09f / tolerance) return '?'
                  if (sat < 0.18f * tolerance) return 'x'
                  return when {
                      hue in 75f..175f -> 'g'
                      hue in 20f..74f -> 'y'
                      else -> 'x'
                  }
              }
          }
          EOF

