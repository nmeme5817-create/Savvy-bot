name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install SDK bits
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" || true

      - name: Write project
        run: |
          mkdir -p app/src/main/java/live/savvybot
          mkdir -p app/src/main/res/xml app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SavvyBot"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "live.savvybot"
              compileSdk = 35
              defaultConfig {
                  applicationId = "live.savvybot"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService" android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
                  <service android:name=".SavvyA11yService" android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">SavvyBot</string>
              <string name="a11y_desc">Reads the Savvy board so SavvyBot can suggest answers.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:description="@string/a11y_desc" />
          EOF

          cat > app/src/main/java/live/savvybot/SolverEngine.kt <<'EOF'
          package live.savvybot

          class SolverEngine(private val dictionary: List<String>) {

              data class Row(val letters: String, val marks: String)
              data class Result(val pool: List<String>, val ranked: List<String>, val solved: Boolean)

              private class C(
                  val greens: Array<Char?>,
                  val ypos: Set<String>,
                  val min: MutableMap<Char, Int>,
                  val max: MutableMap<Char, Int>
              )

              fun solve(committed: List<Row>, n: Int, solveMode: Boolean): Result {
                  val c = constraints(committed, n)
                  val used = HashSet<Char>()
                  committed.forEach { r -> r.letters.forEach { used.add(it) } }
                  val pool = dictionary.filter { w -> w.length == n && fits(w, c) }
                  if (pool.isEmpty()) return Result(pool, emptyList(), false)
                  return Result(pool, rank(pool, used, n, solveMode), pool.size == 1)
              }

              private fun constraints(rows: List<Row>, n: Int): C {
                  val greens = arrayOfNulls<Char>(n)
                  val ypos = HashSet<String>()
                  val min = HashMap<Char, Int>()
                  val max = HashMap<Char, Int>()
                  for (r in rows) {
                      if (r.letters.length != n || r.marks.length != n) continue
                      val nonGray = HashMap<Char, Int>()
                      for (i in 0 until n) if (r.marks[i] != 'x') {
                          val ch = r.letters[i]
                          nonGray[ch] = (nonGray[ch] ?: 0) + 1
                      }
                      for (i in 0 until n) {
                          val ch = r.letters[i]
                          when (r.marks[i]) {
                              'g' -> { greens[i] = ch; min[ch] = 1 }
                              'y' -> { ypos.add("" + ch + i); min[ch] = 1 }
                          }
                      }
                      for (i in 0 until n) if (r.marks[i] == 'x') {
                          val ch = r.letters[i]
                          max[ch] = minOf(max[ch] ?: 99, nonGray[ch] ?: 0)
                      }
                  }
                  for ((ch, lo) in min) {
                      val hi = max[ch] ?: continue
                      if (hi < lo) max[ch] = lo
                  }
                  return C(greens, ypos, min, max)
              }

              private fun fits(w: String, c: C): Boolean {
                  for (i in w.indices) {
                      val g = c.greens[i]
                      if (g != null && w[i] != g) return false
                  }
                  for (k in c.ypos) if (w[k.last() - '0'] == k.first()) return false
                  val cnt = HashMap<Char, Int>()
                  for (ch in w) cnt[ch] = (cnt[ch] ?: 0) + 1
                  for ((ch, lo) in c.min) if ((cnt[ch] ?: 0) < lo) return false
                  for ((ch, hi) in c.max) if ((cnt[ch] ?: 0) > hi) return false
                  return true
              }

              private fun rank(pool: List<String>, used: Set<Char>, n: Int, solveMode: Boolean): List<String> {
                  val posFreq = Array(n) { HashMap<Char, Int>() }
                  val letterFreq = HashMap<Char, Int>()
                  for (w in pool) for (i in 0 until n) {
                      val ch = w[i]
                      posFreq[i][ch] = (posFreq[i][ch] ?: 0) + 1
                      letterFreq[ch] = (letterFreq[ch] ?: 0) + 1
                  }
                  val tot = pool.size.toFloat()
                  val wg = if (solveMode) 0.55f else 1.0f
                  val wn = if (solveMode) 1.0f else 0.42f
                  return pool.sortedByDescending { w ->
                      var s = 0f
                      for (i in 0 until n) s += wg * ((posFreq[i][w[i]] ?: 0) / tot)
                      val seen = HashSet<Char>()
                      for (ch in w) {
                          if (!seen.add(ch)) continue
                          if (ch !in used) s += wn * ((letterFreq[ch] ?: 0) / tot)
                      }
                      s
                  }
              }
          }
          EOF

