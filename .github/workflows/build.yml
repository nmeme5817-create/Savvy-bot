          package live.savvybot

          import android.os.Handler
          import android.os.Looper

          object Typer {
              private val handler = Handler(Looper.getMainLooper())
              private val SUBMIT = listOf("enter", "submit", "guess", "send", "done")

              fun type(word: String, onDone: () -> Unit = {}) {
                  val svc = SavvyA11yService.instance ?: return
                  var i = 0
                  fun step() {
                      if (i < word.length) {
                          svc.tapLabel(word[i].toString())
                          i++
                          handler.postDelayed(::step, 85)
                      } else {
                          handler.postDelayed({
                              SUBMIT.firstOrNull { svc.tapLabel(it) }
                              onDone()
                          }, 120)
                      }
                  }
                  step()
              }
          }
          EOF

          cat > app/src/main/java/live/savvybot/CaptureService.kt <<'EOF'
          package live.savvybot

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat

          class CaptureService : Service() {

              private lateinit var wm: WindowManager
              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var overlay: LinearLayout? = null
              private lateinit var solver: SolverEngine

              private val handler = Handler(Looper.getMainLooper())
              private var lastHash = 0
              private var busy = false
              private var running = false

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  solver = SolverEngine(WordRepo.load(this))
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> { stopSelf(); return START_NOT_STICKY }
                      ACTION_START -> {
                          notice()
                          val code = intent.getIntExtra("code", 0)
                          @Suppress("DEPRECATION")
                          val data = intent.getParcelableExtra<Intent>("data")
                              ?: return START_NOT_STICKY
                          val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                          projection = mgr.getMediaProjection(code, data)
                          projection?.registerCallback(object : MediaProjection.Callback() {
                              override fun onStop() { stopSelf() }
                          }, handler)
                          begin()
                          buildOverlay()
                          running = true
                          handler.post(::tick)
                      }
                  }
                  return START_STICKY
              }

              private fun notice() {
                  val ch = NotificationChannel(CHANNEL, "SavvyBot", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  val n = NotificationCompat.Builder(this, CHANNEL)
                      .setContentTitle("SavvyBot running")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setOngoing(true).build()
                  startForeground(1, n)
              }

              private fun begin() {
                  val m = resources.displayMetrics
                  reader = ImageReader.newInstance(m.widthPixels, m.heightPixels, PixelFormat.RGBA_8888, 2)
                  display = projection?.createVirtualDisplay(
                      "savvybot", m.widthPixels, m.heightPixels, m.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, handler
                  )
              }

              private fun grab(): Bitmap? {
                  val img = reader?.acquireLatestImage() ?: return null
                  return try {
                      val plane = img.planes[0]
                      val bmp = Bitmap.createBitmap(
                          plane.rowStride / plane.pixelStride, img.height, Bitmap.Config.ARGB_8888
                      )
                      bmp.copyPixelsFromBuffer(plane.buffer)
                      bmp
                  } finally { img.close() }
              }

              private fun tick() {
                  if (!running) return
                  try { step() } catch (t: Throwable) { setStatus("error: " + t.message) }
                  handler.postDelayed(::tick, 300)
              }

              private fun step() {
                  if (busy) return
                  val svc = SavvyA11yService.instance
                  if (svc == null) { setStatus("accessibility off"); return }
                  val cells = svc.readCells()
                  if (cells.isEmpty()) { setStatus("no board on screen"); return }
                  val n = detectWidth(cells)
                  if (n < 4 || n > 7) { setStatus("grid width unclear (" + n + ")"); return }
                  val bmp = grab() ?: return

                  val rows = ArrayList<SolverEngine.Row>()
                  cells.chunked(n).forEach { row ->
                      val letters = row.joinToString("") { it.letter.toString() }
                      val marks = row.map { TileClassifier.classify(bmp, it.bounds, tolerance()) }.joinToString("")
                      if (marks.count { it == 'g' || it == 'y' || it == 'x' } >= n - 1) {
                          rows.add(SolverEngine.Row(letters, marks))
                      }
                  }
                  if (rows.isEmpty()) { setStatus("waiting for marks"); return }

                  val committed = rows.filter { it.marks.any { m -> m != '?' } }
                  val hash = committed.joinToString("|") { it.letters + it.marks }.hashCode()
                  val res = solver.solve(committed, n, false)
                  if (res.pool.isEmpty()) { setStatus("no fit - check board"); return }

                  setStatus(res.pool.size.toString() + " left")
                  render(res.ranked.take(5))
                  if (autoSend() && res.ranked.isNotEmpty() && hash != lastHash && committed.size < 6) {
                      lastHash = hash
                      busy = true
                      Typer.type(res.ranked.first()) { busy = false }
                  }
              }

              private fun detectWidth(cells: List<SavvyA11yService.Cell>): Int {
                  val y0 = cells.first().bounds.centerY()
                  return cells.count { kotlin.math.abs(it.bounds.centerY() - y0) < 30 }
              }

              private fun buildOverlay() {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(18, 12, 18, 14)
                      setBackgroundColor(0xEE0D1117.toInt())
                  }
                  val strip = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL; id = 42
                  }
                  box.addView(strip)
                  box.addView(TextView(this).apply {
                      id = 43; setTextColor(0xFF8FA6BD.toInt()); textSize = 11f
                  })
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.BOTTOM }
                  runCatching { wm.addView(box, p) }
                  overlay = box
              }

              private fun render(words: List<String>) {
                  val strip = overlay?.findViewById<LinearLayout>(42) ?: return
                  strip.removeAllViews()
                  words.forEachIndexed { i, w ->
                      strip.addView(TextView(this).apply {
                          text = w.uppercase()
                          textSize = if (i == 0) 22f else 16f
                          setTextColor(if (i == 0) 0xFFFFFFFF.toInt() else 0xFFCFE3FF.toInt())
                          setPadding(16, 8, 16, 8)
                          setOnClickListener {
                              lastHash = 0
                              busy = true
                              Typer.type(w) { busy = false }
                          }
                      })
                  }
              }

              private fun setStatus(s: String) { overlay?.findViewById<TextView>(43)?.text = s }
              private fun tolerance() = getSharedPreferences("bot", MODE_PRIVATE).getFloat("tol", 1f)
              private fun autoSend() = getSharedPreferences("bot", MODE_PRIVATE).getBoolean("auto", false)

              override fun onDestroy() {
                  running = false
                  handler.removeCallbacksAndMessages(null)
                  overlay?.let { runCatching { wm.removeView(it) } }
                  display?.release(); reader?.close(); projection?.stop()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?) = null

              companion object {
                  const val CHANNEL = "savvybot"
                  const val ACTION_START = "start"
                  const val ACTION_STOP = "stop"
              }
          }
          EOF

